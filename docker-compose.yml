services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: lasatrading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lasa}
      POSTGRES_DB: ${POSTGRES_DB:-lasa}
    ports:
      # `127.0.0.1:` y no un puerto suelto porque publicar el puerto en todas las
      # interfaces abre la base de datos a la red local entera, y Postgres con una
      # contraseña corta es la entrada que se prueba sola. Todo el stack corre en
      # el host y se conecta por `localhost`, así que atar el puerto al loopback no
      # quita nada y cierra el acceso desde el resto de la LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lasa} -d ${POSTGRES_DB:-lasa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: lasatrading-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Redis sin contraseña no es un servicio que se pueda publicar: en una red
      # local cualquiera que llegue al puerto puede leer los brokers de Celery y
      # escribirles. Solo el host necesita hablar con él.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: